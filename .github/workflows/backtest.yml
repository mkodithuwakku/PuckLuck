name: Bi-Weekly Walk-Forward Backtest & Self-Tuner

on:
  schedule:
    # 1st and 15th of each month at 11:00 UTC
    - cron: '0 11 1,15 * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  backtest-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Restore & persist warehouse and data/model_params.json cache
        uses: actions/cache@v4
        with:
          path: data/
          key: puckluck-data-backtest-${{ github.run_id }}
          restore-keys: |
            puckluck-data-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run walk-forward backtest, self-tune parameters, and build report
        run: |
          export PUCKLUCK_LIVE_DATE="$(date -u +%Y-%m-%d)"
          python -m scripts.refresh --live --backtest || python -m scripts.refresh --demo --backtest

      - name: Preserve upstream real player picks from gh-pages branch
        run: |
          git fetch origin gh-pages:refs/remotes/origin/gh-pages 2>/dev/null || true
          python -c '
          import json, subprocess
          try:
              local_rep = json.load(open("dist/report.json"))
              cloud_picks = sum(1 for p in local_rep.get("point_scorers", []) if p.get("is_positive_ev"))
              if cloud_picks == 0:
                  res = subprocess.run(["git", "show", "origin/gh-pages:report.json"], capture_output=True, text=True)
                  if res.returncode == 0 and res.stdout.strip():
                      gh_rep = json.loads(res.stdout)
                      if gh_rep.get("active_slate_date") == local_rep.get("active_slate_date"):
                          gh_picks = sum(1 for p in gh_rep.get("point_scorers", []) if p.get("is_positive_ev"))
                          if gh_picks > 0:
                              with open("dist/report.json", "w") as f:
                                  f.write(res.stdout)
                              print("Preserved", gh_picks, "real player picks from gh-pages branch")
          except Exception as exc:
              print("Pick preservation notice:", exc)
          '

      - name: Stage static GitHub Pages bundle (_site)
        run: |
          rm -rf _site
          mkdir -p _site
          cp web/index.html web/styles.css web/app.js web/manifest.webmanifest web/sw.js _site/
          cp dist/report.json _site/report.json

      - name: Verify security boundary (no secrets or SQLite in _site)
        run: |
          ! find _site -name '.env*' -o -name '*.sqlite3' | grep -q .

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
